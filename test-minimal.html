<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Minimal Test</title>
<style>
#network {width:1000px;height:600px;border:1px solid #ccc;margin:0;padding:0;}
body {margin:0;padding:0;}
</style>
</head>
<body>
<div id="network"></div>
<script src="/lib/vis-network.min.js"></script>
<script>
var nodes = new vis.DataSet([
    {id: 1, label: 'Node 1', x: 0, y: 0, fixed: {x: true, y: true}, shape: 'dot', size: 30, color: '#3b82f6'},
    {id: 2, label: 'Node 2', x: 500, y: 0, fixed: {x: true, y: true}, shape: 'dot', size: 30, color: '#10b981'},
    {id: 3, label: 'Node 3', x: 0, y: 300, fixed: {x: true, y: true}, shape: 'dot', size: 30, color: '#f59e0b'},
    {id: 4, label: 'Node 4', x: 500, y: 300, fixed: {x: true, y: true}, shape: 'dot', size: 30, color: '#94a3b8'},
]);
var edges = new vis.DataSet([
    {from: 1, to: 2}, {from: 1, to: 3}, {from: 2, to: 4}, {from: 3, to: 4}
]);
var options = {
    physics: { enabled: false },
    autoResize: false,
    height: '600px',
    width: '1000px'
};
var network = new vis.Network(document.getElementById('network'), {nodes: nodes, edges: edges}, options);
network.on('click', function(p) {
    if (p.nodes.length > 0) {
        var n = nodes.get(p.nodes[0]);
        document.title = 'Clicked ' + n.label + ' at (' + n.x + ',' + n.y + ')';
    } else {
        document.title = 'Click on empty space';
    }
});
</script>
</body>
</html>
