<!doctype html><html lang=zh-cn dir=ltr><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><meta name=description content=" 本文更新于 2026-04-02\nMySQL 索引概述 (Index) 索引是帮助 MySQL 高效获取数据 的 数据结构 (有序)。（⭐⭐⭐）\n在数据之外，数据库系统还维护着满足特定查找算法的数据结构，这些数据结构以某种方式引用（指向）数据， 这样就可以在这些数据结构上实现高级查找算法，这种数据结构就是索引 索引的优缺点 特性 优点 缺点 查询效率 提高数据检索的效率，降低数据库的 IO 成本。 索引列也是要占用空间的。 排序效率 通过索引列对数据进行排序，降低 CPU 的消耗。 索引大大提高了查询效率，但降低了更新表的速度（如 INSERT、UPDATE、DELETE）。 索引的本质：数据结构 假设有一张包含数百万条记录的表，如果没有索引，数据库必须进行全表扫描 (Full Table Scan)，即从第一行开始逐行比对，效率极低。\n"><title>进阶-索引</title><link rel=canonical href=/post/%E8%BF%9B%E9%98%B6-%E7%B4%A2%E5%BC%95/><link rel=stylesheet href=/scss/style.min.0796a55d1ec437ca19df0d356dc4a9445d85cbc5d0d35a6da421f852fceb749c.css><meta property='og:title' content="进阶-索引"><meta property='og:description' content=" 本文更新于 2026-04-02\nMySQL 索引概述 (Index) 索引是帮助 MySQL 高效获取数据 的 数据结构 (有序)。（⭐⭐⭐）\n在数据之外，数据库系统还维护着满足特定查找算法的数据结构，这些数据结构以某种方式引用（指向）数据， 这样就可以在这些数据结构上实现高级查找算法，这种数据结构就是索引 索引的优缺点 特性 优点 缺点 查询效率 提高数据检索的效率，降低数据库的 IO 成本。 索引列也是要占用空间的。 排序效率 通过索引列对数据进行排序，降低 CPU 的消耗。 索引大大提高了查询效率，但降低了更新表的速度（如 INSERT、UPDATE、DELETE）。 索引的本质：数据结构 假设有一张包含数百万条记录的表，如果没有索引，数据库必须进行全表扫描 (Full Table Scan)，即从第一行开始逐行比对，效率极低。\n"><meta property='og:url' content='/post/%E8%BF%9B%E9%98%B6-%E7%B4%A2%E5%BC%95/'><meta property='og:site_name' content='Creat'><meta property='og:type' content='article'><meta property='article:section' content='Post'><meta property='article:published_time' content='2026-04-02T00:00:00+00:00'><meta property='article:modified_time' content='2026-04-02T00:00:00+00:00'><meta name=twitter:title content="进阶-索引"><meta name=twitter:description content=" 本文更新于 2026-04-02\nMySQL 索引概述 (Index) 索引是帮助 MySQL 高效获取数据 的 数据结构 (有序)。（⭐⭐⭐）\n在数据之外，数据库系统还维护着满足特定查找算法的数据结构，这些数据结构以某种方式引用（指向）数据， 这样就可以在这些数据结构上实现高级查找算法，这种数据结构就是索引 索引的优缺点 特性 优点 缺点 查询效率 提高数据检索的效率，降低数据库的 IO 成本。 索引列也是要占用空间的。 排序效率 通过索引列对数据进行排序，降低 CPU 的消耗。 索引大大提高了查询效率，但降低了更新表的速度（如 INSERT、UPDATE、DELETE）。 索引的本质：数据结构 假设有一张包含数百万条记录的表，如果没有索引，数据库必须进行全表扫描 (Ful
