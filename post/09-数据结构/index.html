<!doctype html><html lang=zh-cn dir=ltr><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><meta name=description content="栈Stack 后进先出，先进后出 压栈/进栈：数据进入栈模型的过程 弹栈/出栈：数据离开栈模型的过程 队列Queue 先进先出，后进后出 入队列：数据从后端进入队列模型的过程 出队列：数据从前端离开队列模型的过程 数组 ==查询速度快==：查询数据通过地址值和索引定位，查询任意数据耗时相同（元素在内存中是连续存储的） ==删除效率低==：要将原始数据删除，同时后面每个数据前移 ==添加效率低==：添加位置后的每个数据后移，再添加元素 链表 链表中的结点是独立的对象，在内存中是不连续的，每个节点包含数据值和下一个结点的地址 链表==查询慢==，无论查询哪个数据都从头开始找。 链表的==增删快==（对比数组） 树 [父节点地址值，值，左子节点地址值，右子节点地址值] 度：每一个节点的 子节点 数量 树高：树的总层数 10 <-- 根节点 / \\ 5 15 <-- 第二层 / \\ \\ 3 7 20 <-- 第三层 / 6 <-- 第四层 二叉树的遍历方式 前序遍历 从根节点开始，按照当前节点，左子节点，右子节点的顺序遍历 中序遍历 从最左边的子节点开始，然后按照左子节点，当前节点，右子节点的顺序遍历 后序遍历 从最右边的子节点开始，然后按照左子节点，右子节点，当前节点的顺序遍历 层序遍历 从根节点开始一层一层遍历 二叉查找树 每一个节点上最多有两个子节点 任意节点左子树上的值都小于当前节点 任意节点右子树上的值都大于当前节点 添加节点 小的存左边，大的存右边，一样的不存 弊端 左子树全部为空，从形式上看，更像一个==单链表== 插入速度没有影响 查询速度明显降低 解决弊端：平衡二叉树 平衡二叉树也叫\u00a0平衡二叉搜索树（Self-balancing binary search tree），又被称为 AVL 树，可以保证\u00a0查询效率较高。它是解决\u00a0二叉排序\u00a0可能出现的查询问题。\n"><title>09-数据结构</title><link rel=canonical href=/post/09-%E6%95%B0%E6%8D%AE%E7%BB%93%E6%9E%84/><link rel=stylesheet href=/scss/style.min.0796a55d1ec437ca19df0d356dc4a9445d85cbc5d0d35a6da421f852fceb749c.css><meta property='og:title' content="09-数据结构"><meta property='og:description' content="栈Stack 后进先出，先进后出 压栈/进栈：数据进入栈模型的过程 弹栈/出栈：数据离开栈模型的过程 队列Queue 先进先出，后进后出 入队列：数据从后端进入队列模型的过程 出队列：数据从前端离开队列模型的过程 数组 ==查询速度快==：查询数据通过地址值和索引定位，查询任意数据耗时相同（元素在内存中是连续存储的） ==删除效率低==：要将原始数据删除，同时后面每个数据前移 ==添加效率低==：添加位置后的每个数据后移，再添加元素 链表 链表中的结点是独立的对象，在内存中是不连续的，每个节点包含数据值和下一个结点的地址 链表==查询慢==，无论查询哪个数据都从头开始找。 链表的==增删快==（对比数组） 树 [父节点地址值，值，左子节点地址值，右子节点地址值] 度：每一个节点的 子节点 数量 树高：树的总层数 10 <-- 根节点 / \\ 5 15 <-- 第二层 / \\ \\ 3 7 20 <-- 第三层 / 6 <-- 第四层 二叉树的遍历方式 前序遍历 从根节点开始，按照当前节点，左子节点，右子节点的顺序遍历 中序遍历 从最左边的子节点开始，然后按照左子节点，当前节点，右子节点的顺序遍历 后序遍历 从最右边的子节点开始，然后按照左子节点，右子节点，当前节点的顺序遍历 层序遍历 从根节点开始一层一层遍历 二叉查找树 每一个节点上最多有两个子节点 任意节点左子树上的值都小于当前节点 任意节点右子树上的值都大于当前节点 添加节点 小的存左边，大的存右边，一样的不存 弊端 左子树全部为空，从形式上看，更像一个==单链表== 插入速度没有影响 查询速度明显降低 解决弊端：平衡二叉树 平衡二叉树也叫\u00a0平衡二叉搜索树（
